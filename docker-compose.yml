services:
  postgres:
    image: postgres:16
    container_name: xalqbonus-pg
    environment:
      POSTGRES_USER: xalqbonus
      POSTGRES_PASSWORD: xalqbonus
      POSTGRES_DB: xalqbonus
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xalqbonus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xalqbonus-redis
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
