# Входная дверь машины — один стек на сервер, окружению не принадлежит. Держит 80 и 443,
# знает домены машины, выпускает и хранит сертификаты (docs/infra.md → «Веб-морда за Caddy»).
name: xalqbonus-proxy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Свой .env: домены и адрес центра сертификации. Переменные приложения, базы
    # и очереди двери не нужны и не передаются.
    env_file:
      - ../.env
    # Порты фиксированные, без переменных: дверь одна на машину, нестандартных портов
    # у неё не бывает — ради этого схема и заведена.
    ports:
      - "80:80"
      - "443:443"
    # Каталог монтируется целиком, а не отдельным файлом: монтирование файла привязывает
    # контейнер к конкретному файлу на диске, а не к пути. Ни правка редактором, ни обновление
    # дерева из репозитория файл на месте не меняют — оба пишут новый и переставляют имя
    # на него, и правки перестают применяться молча.
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    # depends_on на приложение нет и быть не может: дверь и окружение — разные стеки.
    # Порядок подъёма не важен, недоступное приложение дверь показывает ошибкой шлюза.

networks:
  edge:
    name: xalqbonus-edge
    external: true

volumes:
  # caddy_data не стирается никогда: в нём живут выпущенные сертификаты, а перевыпуск
  # упирается в недельные лимиты центра сертификации. Целей с удалением томов у двери нет.
  caddy_data:
  caddy_config:
