# Режим копии боевой базы (issue #365): накладывается на compose.local.yml целями `make copy-*`
# и меняет только окружение приложения и воркера — `environment:` идёт поверх `../.env`.
# База и очередь остаются те же, что у рабочего стека: копия — отдельная база в том же
# контейнере postgres, очереди — отдельная база в том же Redis.
#
# Обратно — `make up-d`: compose видит конфигурацию без этого файла и пересоздаёт `app`
# и `worker` с окружением из `.env`.

x-copy-environment: &copy-environment
  # Имя копии зашито так же, как в Makefile (`COPY_DB`): копия всегда одна. Пользователь
  # и пароль — рабочие из `.env`, копия заливается под ними же.
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/xalqbonus_prod_copy?schema=xb
  # Своя база Redis: задачи, поставленные рабочей базой, не исполняются на копии, и наоборот.
  REDIS_URL: redis://redis:6379/1
  SYNC_LIVE_ENABLED: "false"
  SYNC_CATCHUP_ENABLED: "false"
  SYNC_REGISTRY_ENABLED: "false"
  # Выключатели снимают только расписание: разовые прогоны (`make sync-orders`, `fleet-history`)
  # ими не останавливаются. Домен `.invalid` не разрешается никогда, и любой запрос к Fleet
  # падает до сети, не тратя квоту ключа парка. Сам ключ остаётся в окружении — без него
  # процесс не стартует (server/utils/requiredEnv.ts).
  YANDEX_BASE_URL: http://fleet-disabled.invalid/
  # TG_OUTGOING_ALLOWLIST не переопределяется намеренно: в копии настоящие `telegram_chat_id`
  # водителей, и вне прода список из `.env` уже запрещает писать всем, кого в нём нет.

services:
  app:
    environment: *copy-environment

  worker:
    environment: *copy-environment
