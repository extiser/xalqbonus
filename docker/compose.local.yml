name: xalqbonus-local

services:
  # Приложение и воркер собираются из одного образа и отличаются только командой запуска.
  # Причина не в нагрузке, её нет: синхронизацию нужно уметь остановить, не останавливая
  # веб, и читать её логи отдельно (docs/infra.md).
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: build
    volumes:
      - ..:/srv
      # Анонимные тома: нативные модули в дереве хоста собраны под macOS и в контейнере
      # не работают, а .nuxt хост и контейнер иначе перетирают друг другу.
      - /srv/node_modules
      - /srv/.nuxt
    ports:
      # 3000 и 3001 на машине заняты другими проектами — порт смещён по тому же правилу,
      # что база и очередь (docs/infra.md → «Порты»).
      - "3003:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ../.env
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    # Проба образа живёт в этапе runner, а локальный стек поднимается из этапа build —
    # здесь она задаётся своя. curl в сборочном образе нет, busybox wget есть. Адрес числом:
    # busybox резолвит localhost в ::1, а сервер слушает IPv4.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: build
    volumes:
      - ..:/srv
      - /srv/node_modules
      - /srv/.nuxt
    environment:
      - NODE_ENV=development
    env_file:
      - ../.env
    command: sh -c "npm install && npm run dev:worker"
    # HTTP воркер не слушает, поэтому проба образа ему не годится: смотрим на возраст
    # отметки живого цикла. Процесс, потерявший связь с очередью, отметку не обновляет
    # и краснеет — в отличие от проверки «процесс запущен», которая зеленела бы всегда.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 30"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    # Не alpine: musl и glibc сортируют текст по-разному, и кластер, созданный одной сборкой,
    # другая открывает с расхождением версии сортировки — индексы по тексту начинают врать.
    # Локальная копия продовой базы создана образом postgres:16, окружения держатся его же.
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Проба по TCP, а не по unix-сокету: на первом старте контейнера (пустой том) initdb
    # поднимает временный сервер, слушающий только сокет, — проба по сокету зеленеет до того,
    # как база действительно начинает принимать соединения по сети.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
