<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Загрузка приложения</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
<style>
/* СЛУЖЕБНОЕ СОСТОЯНИЕ — ЗАГРУЗКА. Пока не пришёл /api/miniapp/me. Сегодня в коде это «…» по центру.
   Логотип по центру над загрузчиком, текста нет.

   Служебное состояние приложения — «заглушка» из app/pages/app.vue (stage 'loading' / 'error',
   failWith): текст вместо экрана и, если повтор имеет смысл, «Обновить». Вид — как у потока
   регистрации (registration.md): логотип слева, по левому краю, живой фон, нажимаемое внизу.
   Двуязычные заглушки — как шаг 1 регистрации: чей это человек, в этот момент не знаем, и спросить
   перевод у сервера не у кого (комментарий в app.vue). Узбекский первым, черновой.
   Заголовки заглушек — предложение, в коде их нет.
   Вынесено из листа app-states.html (сессия 54, 23-09-2026): один экран — один файл.
   Предел ширины 520 (16 Pro Max даёт 440), проверено замером 22-09-2026. */

html, body { background: #0B0D11; margin: 0; }
body { display: flex; justify-content: center; }
.screen {
  position: relative; width: 100%; max-width: 520px; min-height: 100dvh;
  box-sizing: border-box; background: #0B0D11; color: #F4F6F8;
  font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
/* ------------------------------------------------------------------ живой фон
   Из эталона ../app/main-screen.html без правок: массы дышат, экран не стоит мёртвым. */
.bg { position: absolute; inset: 0 0 auto 0; height: 470px; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; will-change: transform, opacity; }
@keyframes drift-core {
  0%   { transform: translate(-150px, -10px) scale(1.00); opacity: 0.92; }
  25%  { transform: translate(-60px,  60px) scale(1.22); opacity: 1.00; }
  50%  { transform: translate(-170px, 96px) scale(0.90); opacity: 0.80; }
  75%  { transform: translate(-260px, 24px) scale(1.12); opacity: 0.95; }
  100% { transform: translate(-150px, -10px) scale(1.00); opacity: 0.92; }
}
@keyframes drift-wine {
  0%   { transform: translate(-230px,  40px) scale(1.08); opacity: 0.80; }
  30%  { transform: translate(-280px, -30px) scale(0.88); opacity: 1.00; }
  60%  { transform: translate(-90px,  104px) scale(1.26); opacity: 0.70; }
  100% { transform: translate(-230px,  40px) scale(1.08); opacity: 0.80; }
}
@keyframes drift-amber {
  0%   { transform: translate(-90px,  86px) scale(0.96); opacity: 0.70; }
  35%  { transform: translate(-250px, 20px) scale(1.22); opacity: 1.00; }
  70%  { transform: translate(-40px,  116px) scale(1.06); opacity: 0.62; }
  100% { transform: translate(-90px,  86px) scale(0.96); opacity: 0.70; }
}
.b-core  { left: 50%; top: 20px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(232,54,93,0.55) 0%, rgba(232,54,93,0) 68%); filter: blur(10px); animation: drift-core 13s ease-in-out infinite; }
.b-wine  { left: 50%; top: 40px; width: 360px; height: 360px; background: radial-gradient(circle, rgba(120,24,60,0.60) 0%, rgba(120,24,60,0) 70%); filter: blur(14px); animation: drift-wine 17s ease-in-out infinite; }
.b-amber { left: 50%; top: 60px; width: 260px; height: 260px; background: radial-gradient(circle, rgba(247,160,60,0.32) 0%, rgba(247,160,60,0) 70%); filter: blur(12px); animation: drift-amber 23s ease-in-out infinite; }
.fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,13,17,0) 52%, rgba(11,13,17,0.86) 86%, #0B0D11 100%); }
.top { position: relative; z-index: 2; display: flex; align-items: center; padding: 50px 20px 0; min-height: 36px; }
.logo { width: 68px; height: auto; display: block; }
.hero { position: relative; z-index: 1; flex-grow: 1; display: flex; flex-direction: column; padding: 140px 20px 0; }
.hello { display: flex; flex-direction: column; gap: 26px; }
.hello .blk { display: flex; flex-direction: column; gap: 10px; }
.hello b { font-size: 28px; font-weight: 800; letter-spacing: 0; line-height: 1.28; }
.hello p { margin: 0; max-width: 360px; font-size: 15px; font-weight: 400; line-height: 1.5; color: #C2C9D3; }
.hello p + p { margin-top: 10px; }
.hello .ru b { font-size: 21px; font-weight: 700; letter-spacing: 0.1px; line-height: 1.32; color: #A9B2BF; }
.hello .ru p { color: #8A93A2; }
.foot { position: relative; z-index: 2; padding: 22px 20px calc(50px + env(safe-area-inset-bottom)); }
.send { width: 100%; height: 52px; border: 0; border-radius: 16px; cursor: pointer; background: #E8365D; color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; box-shadow: 0 8px 26px rgba(232,54,93,0.38); }
@media (prefers-reduced-motion: reduce) { .b-core, .b-wine, .b-amber { animation: none; } }

/* Загрузка — логотип по центру и под ним круглый загрузчик, белый (вариант Е из
   state-loading-variants.html, выбор Руслана 23-09-2026). Кольцо 22, линия 2.5, оборот 0.9 с.
   Появляется и уходит плавно: 0.4 с на вход, 0.3 с на выход — логотип при этом стоит на месте. */
.center { position: relative; z-index: 1; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-bottom: 40px; }
.center .logo { width: 96px; }
.ring { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.13); border-top-color: #F4F6F8;
  animation: ring 0.9s linear infinite; opacity: 0; transform: scale(0.85); transition: opacity 0.4s ease-out, transform 0.4s ease-out; }
.ring.on { opacity: 1; transform: scale(1); }
.ring.off { opacity: 0; transform: scale(0.85); transition-duration: 0.3s; transition-timing-function: ease-in; }
@keyframes ring { to { rotate: 360deg; } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; transition: opacity 0.2s linear; transform: none; } }
</style></head>

<script>
/* Только для показа на макете: вход → крутится → выход → пауза, по кругу.
   В приложении класс on ставится при монтировании, off — когда пришёл ответ; экран меняется по transitionend. */
const r = document.getElementById('ring');
function cycle() {
  r.className = 'ring';
  requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add('on')));
  setTimeout(() => r.classList.add('off'), 2400);
  setTimeout(cycle, 3400);
}
cycle();
