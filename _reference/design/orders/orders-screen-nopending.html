<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои заказы — ждущих нет</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Unbounded:wght@200;300;600;700&display=swap">
<style>
/* РАЗДЕЛ «МОИ ЗАКАЗЫ», КОГДА ЖДУЩИХ НЕТ. 24-09-2026, сессия 55, решение Руслана: верхняя группа
   остаётся с нулём и строкой «Здесь пусто» по центру. Экран — orders-screen.html. */

/* РАЗДЕЛ «МОИ ЗАКАЗЫ» — список заказов водителя, экран целиком.
   Нарисован 22-09-2026, сессия 52, по задаче T51.

   Шапка перенесена из ../artboard/section-bar.html и правится ТАМ.
   Что решается здесь: деление на две группы и состав строки заказа.
   Экран одного заказа — свой файл, рисуется следующим (в коде это MemberOrderCard.vue).

   Снято с кода, не придумано:
   `shared/types/miniapp.ts` → `MemberOrder` (поля строки),
   `app/components/molecules/MemberOrderItem.vue` (состав строки списка),
   `server/services/orders/readMemberOrders.ts` (потолок 50, листания нет,
    висящие сверху — порядок приходит с сервера готовым),
   `server/bot/texts.ts` (`orders_title`, `order_title`, `order_status_*`,
    `order_cancel_reason_*`, `order_expires`, `orders_empty`, `orders_failed`).

   ВНИМАНИЕ: срок «заберите до» в строке списка — правка кода. Сегодня `expiresNote`
   показывается только на экране заказа.

   Предел ширины 520: на 16 Pro Max логическая ширина 440 (замер 22-09-2026). */

html, body { background: #0B0D11; margin: 0; }
body { display: flex; justify-content: center; }

.screen {
  position: relative; width: 100%; max-width: 520px; min-height: 100dvh;
  box-sizing: border-box; background: #0B0D11; color: #F4F6F8;
  font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column;
  padding-bottom: calc(40px + env(safe-area-inset-bottom));
}

/* ------------------------------------------------------- шапка раздела
   Перенесена из ../artboard/section-bar.html — общий блок всех разделов. Правки идут туда,
   сюда переносятся копией. В коде это один компонент, а не разметка в каждом экране. */
.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  background: rgba(11, 13, 17, 0.82);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.bar .back {
  width: 40px; height: 40px; flex-shrink: 0; border: 0; padding: 0; cursor: pointer;
  border-radius: 999px; background: rgba(255, 255, 255, 0.07);
  display: flex; align-items: center; justify-content: center;
}


.bar h1 {
  margin: 0; flex-grow: 1; min-width: 0;
  font-family: Unbounded, Manrope, sans-serif;
  font-size: 19px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.25;
}

/* Место под действие справа занято всегда, даже когда кнопки нет: иначе заголовок
   прыгал бы вбок при переходе между разделами. */
.bar .act { width: 40px; height: 40px; flex-shrink: 0; }
/* Баланс в шапке — копия .bar .bal из ../artboard/catalog-bar.html (сессия 56, 24-09-2026: решение сессии 55 —
   баланс в шапке каталога, «Моих наград», «Моих заказов», экрана заказа и истории). Стоит на месте действия. */
.bar .bal { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.bar .bal .lbl { font-size: 12px; font-weight: 400; color: #8A93A2; }
.bar .bal .num { display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ группы
   Те же подписи, что у дней в истории и групп в наградах: разделы водителя должны
   выглядеть одним приложением. */
.list { display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 20px; }

.group {
  font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
  color: #8A93A2; padding: 18px 2px 2px;
}

/* --------------------------------------------------------- строка заказа
   Строка, а не карточка заказа: состав, адрес офиса и кнопка отмены живут на экране заказа.
   Нажатие открывает его. */
.order {
  display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left;
  border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.09);
  background: #14171D; padding: 14px 16px; cursor: pointer;
  font-family: inherit; color: inherit;
}

/* Шапка — две колонки: слева номер с состоянием и причиной, справа число с подписью.
   Состояние должно стоять прямо под номером, а не под всей шапкой: подпись под числом
   делает правый столбик выше, и строка состояния уезжала от номера на целую строку. */
.order .head { display: flex; align-items: flex-start; gap: 12px; }
.order .main { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; }
.order .num { font-size: 16px; font-weight: 700; }

/* Число и подпись под ним столбиком справа: «списано со счёта» у выданного, «вернулось
   на счёт» у отменённого. Подпись стоит там же, где число, потому что объясняет именно его —
   отдельной строкой внизу карточки она отвечала бы непонятно на что. */
.order .money { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.order .money .cap-sum { font-size: 12px; font-weight: 300; color: #8A93A2; }

/* Сумма заказа — обычным цветом (Руслан, 22-09-2026). Алый со знаком минус остаётся
   только в истории баллов: там он отвечает на вопрос «куда делись баллы», а здесь каждая
   строка и так про списание, и красным был бы весь экран.

   Знак минус — у выданного: списание состоялось и назад не пойдёт. У висящего знака нет —
   там главное код и срок; у отменённого нет тоже — баллы вернулись, и минус был бы неправдой. */
.order .sum { flex-shrink: 0; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: #C2C9D3; }

/* Офис — внизу карточки, под состоянием: сначала «что с заказом», потом «где он лежит».
   Стоя сразу под номером, адрес отвечал на вопрос, которого водитель ещё не задал.

   У отменённого офиса нет: ехать было некуда, и строка отвечала бы на незаданный вопрос.
   У висящего он говорит, куда идти, у выданного — куда водитель тогда ездил.

   Строка собрана как состояние: слово-метка, точка, значение. Иначе имя офиса пришлось бы
   склонять — «Офис на Чиланзаре», — а оно приходит из базы как есть, и склонять его
   мы не будем ни на русском, ни на узбекском. */
.order .office { margin-top: 6px; font-size: 13px; font-weight: 300; color: #8A93A2; }
/* Слово «Офис» обычным весом: оно не состояние, а подпись к значению — выделять его
   значило бы поставить адрес вровень с «Отменён». */
.order .office b { font-weight: 300; color: #8A93A2; }
/* Состояние — одной строкой единым весом: «Выдан · 20.09.2026, 16:10». Точка отделяет
   слово от даты, как у висящего «Ждёт выдачи · заберите до …». Значка нет — он повторял бы
   слово; выделения внутри строки нет — слово и так стоит первым. */
/* Уточнение серым — 13/300 #8A93A2, одно на все экраны (сверка шрифтов, сессия 53, 23-09-2026). */
.order .state { font-size: 13px; font-weight: 300; color: #8A93A2; margin-top: 5px; }

/* У закрытого заказа слово несёт состояние, дата только уточняет — отсюда разный вес:
   «Выдан» жирным и светлым, дата тонкой и серой. У висящего строка ровная: там она вся
   про одно — заказ ждёт и до какого часа. */
.order.issued .state, .order.cancelled .state { font-weight: 300; }
/* Состояние цветным словом — 13/600, одно на все карточки (сверка шрифтов, сессия 53, 23-09-2026). */
.order .state b { font-weight: 600; color: #E4E8EE; }

/* Цвет слова состояния (Руслан, 22-09-2026): «Выдан» зелёным, «Отменён» алым. Алый тот же,
   что у списания в истории баллов, — второго красного в приложении не заводим. */
.order.issued .state b { color: #5FD08A; }
.order.cancelled .state b { color: #FF5C78; }
.order .reason { font-size: 13px; font-weight: 300; color: #8A93A2; }

/* Ждёт выдачи: зелёная рамка и код. Зелёный здесь единственный акцент — заказы на главный
   экран не выносятся, спорить ему не с чем (в отличие от наград, где выбрано золото). */
.order.pending {
  border-color: rgba(95, 208, 138, 0.55);
  background: linear-gradient(180deg, rgba(95, 208, 138, 0.07) 0%, rgba(20, 23, 29, 1) 62%);
}

.order.pending .state { color: #5FD08A; font-weight: 600; }

/* Срок — серым: зелёным отмечено состояние, «заберите до …» только уточняет его. Тем же
   цветом уточнение тянуло бы на себя вторым акцентом внутри одной строки — как «код внутри»
   у наград (../artboard/rewards-block.md). */
.order.pending .state .hint { color: #8A93A2; font-weight: 300; }

/* Нижняя строка карточки — отбита линией, как на экране заказа (order-screen-states.html):
   сверху «что это за заказ», снизу единственное, что от него нужно. У висящего это обещание
   кода, у отменённого — вернувшиеся баллы.

   Кода в списке нет — одно правило с наградами (../artboard/rewards-block.md): код виден
   любому, кто заглянул через плечо, а нужен один раз и у стойки. Отсюда следствие —
   строка обязана открываться. */
/* Ссылка и строка-действие — 14/500, цвет по смыслу (сверка шрифтов, сессия 53, 23-09-2026). */
.order .foot {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.07);
  font-size: 14px; font-weight: 500; color: #5FD08A;
}

/* У закрытого заказа нижняя строка серая и зовёт только посмотреть состав: там нечего
   забирать, но вопрос «что я тогда заказывал» остаётся. Зелёным зовёт лишь висящий —
   единственный, за которым действительно идут. */
.order.issued .foot, .order.cancelled .foot { color: #8A93A2; }

.order .foot .grow { flex-grow: 1; min-width: 0; }

/* Выдан: спокойная строка, делать нечего. */
.order.issued .num { font-weight: 600; }

/* Отменённый и выданный не гасятся прозрачностью: закрытый заказ — не мусор, а запись,
   к которой возвращаются с вопросом «что я тогда заказывал». Их отличает состояние словами
   и отсутствие зелёной рамки, этого хватает. */

/* Отдельного правила для суммы отменённого больше нет: цвет у всех один, а гасит строку
   сама карточка. Возврат виден в истории начислений строкой «Возврат заказа». */


body { display: block !important; }
.sheetwrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 60px; display: flex; flex-direction: column; gap: 14px; font-family: Manrope, sans-serif; color: #F4F6F8; }
.nt { font-size: 12px; color: #8A93A2; line-height: 1.45; }
.sheetwrap .screen { min-height: 0 !important; border: 1px solid rgba(255,255,255,.08); border-radius: 24px; overflow: hidden; }
.sheetwrap .bar { position: static !important; }
/* Группа без записей не пропадает (Руслан, 24-09-2026): иначе водитель решит, что раздел исчез.
   Под ней «Здесь пусто» по центру, отступ сверху и снизу одинаковый — 36 px от подписи группы
   до строки и от строки до следующей группы (2 + зазор 10 + 24 сверху; 8 + зазор 10 + 18 снизу). */
.zero { padding: 24px 4px 8px; text-align: center; font-size: 15px; font-weight: 300; color: #8A93A2; }

</style></head><body><div class="sheetwrap">
<div style="font-family:Unbounded,Manrope,sans-serif;font-size:20px;font-weight:600;letter-spacing:-.4px">Мои заказы: ждущих нет</div>
<div class="nt">Заказы были, но все выданы или отменены. Группа «Ждут выдачи» остаётся с нулём.</div>
<div class="screen">

  <div class="bar">
    <button class="back" aria-label="Назад">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="#E4E8EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>Мои заказы</h1>
    <div class="bal"><span class="lbl">Ваши баллы</span><span class="num"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" class="pom"><ellipse cx="12" cy="14.6" rx="7.6" ry="7.1" fill="#E8365D"/><path d="M9.4 8.4 C10.5 7.7 10.8 6.7 10.6 5.9 C10.1 5.0 9.1 4.3 7.7 3.7 L10.0 4.1 L10.2 2.4 L11.35 3.8 L12 1.7 L12.65 3.8 L13.8 2.4 L14.0 4.1 L16.3 3.7 C14.9 4.3 13.9 5.0 13.4 5.9 C13.2 6.7 13.5 7.7 14.6 8.4 Z" fill="#E8365D"/></svg>1 450</span></div>
  </div>

  <div class="list">

    <div class="group">Ждут выдачи · 0</div>
    <div class="zero">Здесь пусто</div>

    <div class="group">История заказов</div>

    <button class="order issued">
      <span class="head"><span class="main"><span class="num">Заказ № 1039</span><span class="state"><b>Выдан</b> · 20.09.2026, 16:10</span></span><span class="money"><span class="sum">−450 баллов</span><span class="cap-sum">списано со счёта</span></span></span>
      <span class="office"><b>Офис</b> · Чиланзар</span>
      <span class="foot"><span class="grow">Просмотреть</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M9.5 5.5l6.5 6.5-6.5 6.5" stroke="#8A93A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>

    <button class="order cancelled">
      <span class="head"><span class="main"><span class="num">Заказ № 1031</span><span class="state"><b>Отменён</b> · 18.09.2026, 09:40</span><span class="reason">Вы отменили заказ</span></span><span class="money"><span class="sum">1 200 баллов</span><span class="cap-sum">вернулось на счёт</span></span></span>
      <span class="foot"><span class="grow">Просмотреть</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M9.5 5.5l6.5 6.5-6.5 6.5" stroke="#8A93A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>

    <button class="order cancelled">
      <span class="head"><span class="main"><span class="num">Заказ № 1024</span><span class="state"><b>Отменён</b> · 14.09.2026, 10:00</span><span class="reason">Не забрали за сутки</span></span><span class="money"><span class="sum">300 баллов</span><span class="cap-sum">вернулось на счёт</span></span></span>
      <span class="foot"><span class="grow">Просмотреть</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M9.5 5.5l6.5 6.5-6.5 6.5" stroke="#8A93A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>

  </div>

</div>
