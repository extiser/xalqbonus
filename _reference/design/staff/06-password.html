<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сотрудник — пароль для входа с компьютера</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Unbounded:wght@200;300;600;700&display=swap">
<style>
/* ЭКРАН СОТРУДНИКА — ПАРОЛЬ ДЛЯ ВХОДА С КОМПЬЮТЕРА. Шаг 6 блока «Экраны сотрудника» (steps.md),
   открывается строкой «Пароль для входа с компьютера → Задать» в профиле (06-profile.html).
   Собран 26-09-2026, сессия 64. Состояние «ввод»; «сохранено» — 06-password-saved.html
   (один экран — один файл; переключатель состояний убран по замечанию Руслана).
   Правки Руслана 26-09-2026: заголовок «Задать пароль»; подписи над полями; два поля — пароль и повтор; под «Сохранить» — серая «Назад».
   Повтор проверяется в приложении, до запроса: не совпали — алым под вторым полем
   «Пароли не совпадают», «Сохранить» не шлёт. Ручка по-прежнему принимает один пароль.

   Как сейчас в приложении — EmployeePasswordForm.vue: заголовок, пояснение, поле «Новый пароль»
   с подсказкой, «Сохранить пароль»; после — зелёная плашка и «Готово». Здесь то же в нашем стиле:
   - шапка раздела — ../artboard/section-bar.html, заголовок «Пароль»
   - пояснение называет номер, по которому входить: не гадать, какой (phone_e164 учётки)
   - поле — вид поля кода стойки (02-desk.html): заливка #20242C, рамка 50 %, фокус стальной синий
     #5E7AA3, только обычного размера (56) и обычным шрифтом; глазик «показать» справа
   - под полем — «Не короче 10 символов» (PASSWORD_MIN_LENGTH = 10, server/services/employees/config.ts);
     ошибка — там же, алым
   - «Сохранить» — гранатовая L внизу, в зоне большого пальца
   - сохранено — зелёная плашка под полем, как исход стойки (05-desk-issued.html), кнопка
     «Готово» → профиль, где строка уже «Задан» */

html, body { background: #0B0D11; margin: 0; }
body { display: flex; justify-content: center; }
.screen {
  position: relative; width: 100%; max-width: 520px; min-height: 100dvh;
  box-sizing: border-box; background: #0B0D11; color: #F4F6F8;
  font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  background: rgba(11, 13, 17, 0.82);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.bar .back {
  width: 40px; height: 40px; flex-shrink: 0; border: 0; padding: 0; cursor: pointer;
  border-radius: 999px; background: rgba(255, 255, 255, 0.07);
  display: flex; align-items: center; justify-content: center;
}
.bar h1 {
  margin: 0; flex-grow: 1; min-width: 0;
  font-family: Unbounded, Manrope, sans-serif;
  font-size: 19px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.25;
}
.body { padding: 20px 16px 0; flex-grow: 1; }

/* Пояснение — 15/300 серым, номер белым 600: по нему входить. */
.lead { font-size: 15px; font-weight: 300; line-height: 1.5; color: #8A93A2; }
.lead b { font-weight: 600; color: #F4F6F8; white-space: nowrap; }

/* Поле — вид поля кода стойки, обычного размера. */
/* Подпись поля — над полем, 14/500 светло-серым (Руслан 26-09-2026: «надо подписи к полям»). */
.flabel { display: block; margin: 20px 2px 8px; font-size: 14px; font-weight: 500; color: #C2C9D3; }
.field { position: relative; }
.field input {
  display: block; width: 100%; box-sizing: border-box; height: 56px; padding: 0 52px 0 16px;
  border-radius: 16px; background: #20242C; border: 1px solid rgba(255,255,255,0.50); outline: 0;
  color: #F4F6F8; font-family: inherit; font-size: 16px; font-weight: 500;
}
.field input::placeholder { color: #5C6470; font-weight: 400; }
.field input:focus, .field input.focus { outline: 2px solid #5E7AA3; outline-offset: 2px; border-color: #5E7AA3; }
.field .eye {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border: 0; padding: 0; cursor: pointer; border-radius: 999px;
  background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;
}
.field.second { margin-top: 0; }
.hint { margin-top: 8px; padding: 0 2px; font-size: 13px; font-weight: 300; color: #8A93A2; }

/* Плашка «сохранено» — как исход стойки. */
.result { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; padding: 12px 14px;
  border-radius: 14px; font-size: 14px; line-height: 1.45;
  background: rgba(95,208,138,0.10); border: 1px solid rgba(95,208,138,0.35); color: #5FD08A; font-weight: 600; }
.result svg { flex-shrink: 0; margin-top: 1px; }

.actions { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 0; }
/* «Назад» — серая L, как в шторках (xb-button-grey). */
.back-btn { position: relative; z-index: 2; width: 100%; height: 52px; border-radius: 16px; cursor: pointer;
  background: #21242A; color: #F4F6F8; border: 1px solid rgba(255,255,255,0.08); font-family: Manrope, sans-serif; font-size: 15px; font-weight: 600; }
.go { position: relative; z-index: 1; width: 100%; height: 52px; border: 0; border-radius: 16px; cursor: pointer;
  background: #E8365D; color: #fff; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 700;
  box-shadow: 0 8px 26px rgba(232,54,93,0.38); }

.err { margin-top: 8px; padding: 0 2px; font-size: 13px; font-weight: 500; color: #FF7089; }
.saved .result { display: flex; } .result { display: none; }
.saved .hint { display: none; }

</style></head>
<body>
<div class="screen" id="screen">
  <div class="bar">
    <button class="back" aria-label="Назад">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="#E4E8EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>Задать пароль</h1>
  </div>

  <div class="body">
    <div class="lead">С компьютера входят по номеру <b>+998 90 765-43-21</b> и этому паролю.</div>
    <label class="flabel">Пароль</label>
    <div class="field">
      <input type="password" placeholder="Не короче 10 символов" value="qwerty2026x" autocomplete="new-password">
      <button class="eye" aria-label="Показать пароль">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" stroke="#C2C9D3" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8" stroke="#C2C9D3" stroke-width="1.7"/></svg>
      </button>
    </div>
    <div class="hint">Не короче 10 символов</div>
    <label class="flabel">Повторите пароль</label>
    <div class="field second">
      <input class="focus" type="password" placeholder="Тот же пароль ещё раз" value="qwerty20" autocomplete="new-password">
      <button class="eye" aria-label="Показать пароль">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" stroke="#C2C9D3" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8" stroke="#C2C9D3" stroke-width="1.7"/></svg>
      </button>
    </div>
    <div class="err">Пароли не совпадают</div>
    <div class="result"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="9" fill="#5FD08A"/><path d="M7.5 12.3l3 3 6-6.3" stroke="#0B0D11" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Пароль сохранён. Входите с компьютера по номеру телефона и этому паролю.</span></div>
  </div>

  <div class="actions"><button class="go" id="go">Сохранить</button><button class="back-btn">Назад</button></div>
</div>

<script>
  document.querySelectorAll('.eye').forEach(e => e.addEventListener('click', () => {
    const i = e.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password';
  }));
</script>
</body></html>
