<style>
/* ЭКРАН СОТРУДНИКА — ШТОРКА «ВЫДАТЬ ЗАКАЗ?». Состояние шага 3 по «Выдать».
   Под шторкой — копия 03-order-card.html, правится ТАМ. Шторка — эталон ../comeback/04-day-chests-sheet.html
   (без ручки и свайпа, затемнение не закрывает, шапка по центру 24/800 + 13/300, кнопки внизу).
   Вопрос называет водителя по имени: это единственное, что ловит опечатку в коде (так в
   ../../../qa/rewards-section.md про выдачу награды). Кнопки: «Выдать» — той же зелёной, что на
   карточке (не гранат: действие одно и то же), «Назад» — серая (решение 14-09-2026, #134:
   не «Не выдавать»). Нажатие «Выдать» — выдача, шторка закрывается, экран — исход «выдано».

   Ниже — комментарий 03-order-card.html.
   ЭКРАН СОТРУДНИКА — ЗАКАЗ НА СТОЙКЕ. Шаг 3 блока «Экраны сотрудника» (steps.md).
   Собран 26-09-2026, сессия 64, по словам Руслана.

   Открывается по коду или из списка «Ждут выдачи». Сверху вниз: кто (водитель), что (состав),
   сроки, кнопки внизу в зоне большого пальца.

   Откуда куски:
   - шапка раздела — ../artboard/section-bar.html; «назад» здесь уместно — возврат к стойке
   - карточка водителя — ../app/profile-screen.html (.who, .row): фамилия крупно, имя под ней,
     поля строками; по имени и позывному менеджер сверяет, тот ли водитель перед ним
   - состав — ../app/order-screen.html (.rb, .total): миниатюра на xb-photo, название, количество
     и цена за штуку, сумма строки с гранатом, «Сумма» (не «Итого» — решение Руслана 23-09-2026, order-screen.md)
   Подтверждения выдачи и отмены — шторкой (Руслан 26-09-2026): 03-order-issue-sheet.html,
   03-order-cancel-sheet.html — следующими файлами.

   Телефон нажимается и звонит (Руслан 26-09-2026): `tel:` ссылкой, круг с трубкой справа —
   тем же видом, что глазик у ВУ в профиле, трубка зелёная: действие, а не поле. Телефона нет
   (у десятой части профилей) — строка «нет в парке» серым, без трубки, как в профиле водителя.

   Откуда данные — OfficeOrder (shared/types/orders.ts): number, driverName, callsign, phone,
   lines (name, quantity, unitPoints), totalPoints, createdAt, expiresAt. Фото позиции в
   OfficeOrderLine нет — правка контракта при вёрстке. Имя в OfficeOrder одной строкой
   «Фамилия Имя» — раздельно фамилия/имя тоже правка контракта. */

html, body { background: #0B0D11; margin: 0; }
body { display: flex; justify-content: center; }

.screen {
  position: relative; width: 100%; max-width: 520px; min-height: 100dvh;
  box-sizing: border-box; background: #0B0D11; color: #F4F6F8;
  font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

/* ------------------------------------------------------- шапка раздела */
.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  background: rgba(11, 13, 17, 0.82);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.bar .back {
  width: 40px; height: 40px; flex-shrink: 0; border: 0; padding: 0; cursor: pointer;
  border-radius: 999px; background: rgba(255, 255, 255, 0.07);
  display: flex; align-items: center; justify-content: center;
}
.bar h1 {
  margin: 0; flex-grow: 1; min-width: 0;
  font-family: Unbounded, Manrope, sans-serif;
  font-size: 19px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.25;
}

.body { display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 20px; flex-grow: 1; }

/* Подпись группы — как в профиле и истории. */
.group {
  font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
  color: #8A93A2; padding: 18px 2px 2px;
}

.card { border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.09); background: #14171D; overflow: hidden; }

/* ------------------------------------------------------- водитель — из profile-screen.html */
.who { display: flex; align-items: center; gap: 14px; padding: 18px 16px 16px; }
.avatar {
  width: 56px; height: 56px; border-radius: 999px; flex-shrink: 0;
  background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;
}
.who .name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.who .last { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.25; }
.who .first { font-size: 16px; font-weight: 500; color: #C2C9D3; line-height: 1.3; }
.row {
  display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box;
  padding: 0 16px; border-top: 1px solid rgba(255, 255, 255, 0.06); color: inherit; text-decoration: none;
}
.row .label { flex-grow: 1; font-size: 15px; font-weight: 400; color: #8A93A2; }
.row .value {
  font-size: 15px; font-weight: 600; color: #F4F6F8; text-align: right;
  font-variant-numeric: tabular-nums; letter-spacing: 0.3px;
}
/* Телефон — ссылка tel:, вся строка нажимается. Круг с трубкой — вид глазика у ВУ в профиле. */
.call {
  width: 32px; height: 32px; border-radius: 999px; flex-shrink: 0; margin-right: -6px;
  background: rgba(95, 208, 138, 0.14); display: flex; align-items: center; justify-content: center;
}
a.row:active { background: rgba(255,255,255,0.04); }

/* ------------------------------------------------------- состав — из order-screen.html */
.rb { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,.06); }
.rb:first-of-type { border-top: 0; }
.th { width: 44px; height: 44px; border-radius: 12px; background: #F1F2F4; flex-shrink: 0; position: relative; overflow: hidden; }
.th img { position: absolute; inset: 4px; width: 36px; height: 36px; object-fit: contain; mix-blend-mode: multiply; } /* фото товара — как в ../app/order-screen.html (Руслан 26-09-2026, сессия 65: «поставить подходящую из макета») */
.mid { flex-grow: 1; min-width: 0; }
.nm { font-size: 15px; font-weight: 400; line-height: 1.3; }
.sub { margin-top: 3px; font-size: 13px; font-weight: 300; color: #8A93A2; }
.cst { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding-top: 1px; font-size: 15px; font-weight: 600; color: #C2C9D3; font-variant-numeric: tabular-nums; }
.pom { flex-shrink: 0; position: relative; top: 1px; }
.lines { padding: 4px 2px 0; }
.total {
  display: flex; align-items: baseline; gap: 12px;
  margin-top: 4px; padding-top: 13px; border-top: 1px solid rgba(255, 255, 255, 0.14);
}
.total .what { flex-grow: 1; font-size: 15px; font-weight: 700; }
.total .cost { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: #F4F6F8; }

/* Сроки — строками профиля, без подложки: это справка, а не поле для сверки. */
.dates { padding: 14px 2px 0; display: flex; flex-direction: column; gap: 6px; }
.dates div { display: flex; justify-content: space-between; font-size: 14px; }
.dates span { color: #8A93A2; font-weight: 400; }
.dates b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------- кнопки внизу */
/* Правка Руслана 26-09-2026: «Выдать» — зелёная, в том же стиле, что гранатовая L (сплошная,
   белый текст 700), только зелёным, без свечения (Руслан 26-09-2026), и крупнее — 64 вместо 52.
   Зелёный насыщеннее палитрового #5FD08A: на светлом зелёном белый текст не читается.
   «Отменить заказ» — как было: алый контур, как отмена у водителя (.cancel в order-screen.html).
   Зелёной кнопки в шкале не было — новая роль. */
.actions { display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 0; margin-top: auto; }
.actions button { width: 100%; border-radius: 16px; cursor: pointer; font-family: Manrope, sans-serif; }
.issue { position: relative; z-index: 1; height: 64px; border: 0; background: #22B866; color: #fff; font-size: 16px; font-weight: 700; }
.cancel { position: relative; z-index: 2; height: 52px; border: 1px solid rgba(255, 92, 120, 0.40); background: rgba(255, 92, 120, 0.08); color: #FF7089; font-size: 15px; font-weight: 600; }

/* ------------------------------------------------------------- шторка подтверждения
   Классы и значения — один в один с ../app/catalog-office-sheet.html (.sheet, .sheet-head,
   .sheet-btns, .sheet-close); отличается только цвет главной кнопки — зелёная «Выдать»,
   как на карточке, и тоже 64 (Руслан 26-09-2026). Подписи — как в приложении сейчас
   (EmployeeOrderCard.vue): «Да, выдать»; вторая — «Назад», по решению 14-09-2026 (#134),
   не «Не выдавать» (Руслан 26-09-2026, сессия 65). */
.backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.62); }
.sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 31; width: 100%; max-width: 520px;
  box-sizing: border-box; transform: translate(-50%, 0);
  background: #14171D; border-radius: 26px 26px 0 0; box-shadow: 0 -18px 50px -20px rgba(0,0,0,0.9);
  padding: 32px 20px calc(24px + env(safe-area-inset-bottom));
  color: #F4F6F8; font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
}
.sheet-head { text-align: center; }
.sheet-head .s-title { font-size: 24px; font-weight: 800; letter-spacing: -0.2px; margin-bottom: 10px; }
.sheet-head .sub { margin-top: 4px; font-size: 13px; font-weight: 300; line-height: 1.65; color: #A9B2BF; }
.sheet-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.sheet-btns button { width: 100%; height: 52px; padding: 0 16px; border: none; border-radius: 16px; cursor: pointer;
  font-family: Manrope, sans-serif; font-size: 15px; font-weight: 600; }
.sheet-btns .sheet-go { height: 64px; font-size: 16px; font-weight: 700; position: relative; z-index: 1; background: #22B866; color: #fff; }
.sheet-close { position: relative; z-index: 2; background: #21242A; color: #F4F6F8; border: 1px solid rgba(255,255,255,0.08); }
.sheet-close:active { background: #2A2E35; }
</style></head>
