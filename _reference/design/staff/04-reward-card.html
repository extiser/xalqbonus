<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сотрудник — награда на стойке</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Unbounded:wght@200;300;600;700&display=swap">
<style>
/* ЭКРАН СОТРУДНИКА — НАГРАДА НА СТОЙКЕ. Шаг 4 блока «Экраны сотрудника» (steps.md).
   Собран 26-09-2026, сессия 64. Копия 03-order-card.html — общие куски (шапка, водитель,
   сроки, кнопка «Выдать») правятся ТАМ; здесь только приз.

   Отличия от заказа:
   - вместо состава — одна строка приза: фото (товар) или значок подарка (произвольная награда),
     название, под ним откуда — reasonText из OfficeReward («Награда — акция „…“, сундук дня» или
     «Награда — вручную, пояснение»); золотая метка сверху — всё про награды золотое
   - сроки — «Вручена» и «Забрать до»
   - кнопка одна — «Выдать»: отмены награды на стойке нет (в EmployeeRewardCard.vue тоже)
   - подтверждение — шторкой, как у заказа (03-order-issue-sheet.html): «Выдать награду?»

   Откуда данные — OfficeReward (shared/types/rewards.ts): title, kind, driverName, callsign,
   phone, reasonText, createdAt, expiresAt. Фото товара в OfficeReward нет — правка контракта. */

html, body { background: #0B0D11; margin: 0; }
body { display: flex; justify-content: center; }

.screen {
  position: relative; width: 100%; max-width: 520px; min-height: 100dvh;
  box-sizing: border-box; background: #0B0D11; color: #F4F6F8;
  font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

/* ------------------------------------------------------- шапка раздела */
.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  background: rgba(11, 13, 17, 0.82);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.bar .back {
  width: 40px; height: 40px; flex-shrink: 0; border: 0; padding: 0; cursor: pointer;
  border-radius: 999px; background: rgba(255, 255, 255, 0.07);
  display: flex; align-items: center; justify-content: center;
}
.bar h1 {
  margin: 0; flex-grow: 1; min-width: 0;
  font-family: Unbounded, Manrope, sans-serif;
  font-size: 19px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.25;
}

.body { display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 20px; flex-grow: 1; }

/* Подпись группы — как в профиле и истории. */
.group {
  font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
  color: #8A93A2; padding: 18px 2px 2px;
}

.card { border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.09); background: #14171D; overflow: hidden; }

/* ------------------------------------------------------- водитель — из profile-screen.html */
.who { display: flex; align-items: center; gap: 14px; padding: 18px 16px 16px; }
.avatar {
  width: 56px; height: 56px; border-radius: 999px; flex-shrink: 0;
  background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;
}
.who .name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.who .last { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.25; }
.who .first { font-size: 16px; font-weight: 500; color: #C2C9D3; line-height: 1.3; }
.row {
  display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box;
  padding: 0 16px; border-top: 1px solid rgba(255, 255, 255, 0.06); color: inherit; text-decoration: none;
}
.row .label { flex-grow: 1; font-size: 15px; font-weight: 400; color: #8A93A2; }
.row .value {
  font-size: 15px; font-weight: 600; color: #F4F6F8; text-align: right;
  font-variant-numeric: tabular-nums; letter-spacing: 0.3px;
}
/* Телефон — ссылка tel:, вся строка нажимается. Круг с трубкой — вид глазика у ВУ в профиле. */
.call {
  width: 32px; height: 32px; border-radius: 999px; flex-shrink: 0; margin-right: -6px;
  background: rgba(95, 208, 138, 0.14); display: flex; align-items: center; justify-content: center;
}
a.row:active { background: rgba(255,255,255,0.04); }

/* ------------------------------------------------------- состав — из order-screen.html */
.rb { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,.06); }
.rb:first-of-type { border-top: 0; }
.th { width: 44px; height: 44px; border-radius: 12px; background: #F1F2F4; flex-shrink: 0; }
.mid { flex-grow: 1; min-width: 0; }
.nm { font-size: 15px; font-weight: 400; line-height: 1.3; }
.sub { margin-top: 3px; font-size: 13px; font-weight: 300; color: #8A93A2; }
.cst { flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding-top: 1px; font-size: 15px; font-weight: 600; color: #C2C9D3; font-variant-numeric: tabular-nums; }
.pom { flex-shrink: 0; position: relative; top: 1px; }
.lines { padding: 4px 2px 0; }
.total {
  display: flex; align-items: baseline; gap: 12px;
  margin-top: 4px; padding-top: 13px; border-top: 1px solid rgba(255, 255, 255, 0.14);
}
.total .what { flex-grow: 1; font-size: 15px; font-weight: 700; }
.total .cost { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: #F4F6F8; }

/* Сроки — строками профиля, без подложки: это справка, а не поле для сверки. */
.dates { padding: 14px 2px 0; display: flex; flex-direction: column; gap: 6px; }
.dates div { display: flex; justify-content: space-between; font-size: 14px; }
.dates span { color: #8A93A2; font-weight: 400; }
.dates b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------- кнопки внизу */
/* Правка Руслана 26-09-2026: «Выдать» — зелёная, в том же стиле, что гранатовая L (сплошная,
   белый текст 700), только зелёным, без свечения (Руслан 26-09-2026), и крупнее — 64 вместо 52.
   Зелёный насыщеннее палитрового #5FD08A: на светлом зелёном белый текст не читается.
   «Отменить заказ» — как было: алый контур, как отмена у водителя (.cancel в order-screen.html).
   Зелёной кнопки в шкале не было — новая роль. */
.actions { display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 0; margin-top: auto; }
.actions button { width: 100%; border-radius: 16px; cursor: pointer; font-family: Manrope, sans-serif; }
.issue { position: relative; z-index: 1; height: 64px; border: 0; background: #22B866; color: #fff; font-size: 16px; font-weight: 700; }
.cancel { position: relative; z-index: 2; height: 52px; border: 1px solid rgba(255, 92, 120, 0.40); background: rgba(255, 92, 120, 0.08); color: #FF7089; font-size: 15px; font-weight: 600; }

/* ------------------------------------------------------- приз
   Карточкой, как строка «Ждут выдачи»: одна вещь, а не список. Метка — золотая, 11/600. */
.prize { display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.09); background: #14171D; }
.prize .th { width: 56px; height: 56px; border-radius: 14px; }
.prize .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; color: #F7BC3E; }
.prize .pn { margin-top: 3px; font-size: 16px; font-weight: 700; line-height: 1.3; }
.prize .sub { margin-top: 3px; }
</style></head>
<body>
<div class="screen">

  <div class="bar">
    <button class="back" aria-label="Назад">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M14.5 5.5L8 12l6.5 6.5" stroke="#E4E8EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>Награда</h1>
  </div>

  <div class="body">

    <div class="group">Водитель</div>
    <div class="card">
      <div class="who">
        <div class="avatar">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><circle cx="12" cy="8.5" r="3.6" stroke="#B4BCC8" stroke-width="1.8"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6" stroke="#B4BCC8" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="name"><span class="last">Алиев</span><span class="first">Шерзод</span></div>
      </div>
      <div class="row"><span class="label">Позывной</span><span class="value">Б-118</span></div>
      <a class="row" href="tel:+998901234567">
        <span class="label">Телефон</span><span class="value">+998 90 123-45-67</span>
        <span class="call"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M6.6 3.8l2.3-.4 1.6 3.9-1.8 1.3a11 11 0 005.1 5.1l1.3-1.8 3.9 1.6-.4 2.3c-.2 1-1 1.7-2 1.7C10.4 17.5 6.5 13.6 6.5 7.8c0-1 .7-1.8 1.7-2z" fill="#5FD08A"/></svg></span>
      </a>
    </div>

    <div class="group">Приз</div>
    <div class="prize">
      <div class="th"></div>
      <div class="mid">
        <div class="tag">Награда · из акции</div>
        <div class="pn">Тряпка для кузова</div>
        <div class="sub">«Неделя возвращения», сундук дня</div>
      </div>
    </div>

    <div class="dates">
      <div><span>Вручена</span><b>26.09, 13:52</b></div>
      <div><span>Забрать до</span><b>06.10, 13:52</b></div>
    </div>
  </div>

  <div class="actions">
    <button class="issue">Выдать</button>
  </div>
</div>
</body></html>
