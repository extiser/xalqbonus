<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сотрудник — выбор офиса</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Unbounded:wght@200;300;600;700&display=swap">
<style>
/* ЭКРАН СОТРУДНИКА — ВЫБОР ОФИСА. Шаг 1 блока «Экраны сотрудника» (steps.md).
   Собран 26-09-2026, сессия 64, по словам Руслана.

   Когда показывается: у сотрудника больше одного офиса. У owner и admin открыты все офисы
   парка — они видят этот экран всегда; менеджер с одним офисом попадает сразу на стойку.

   Шапка — из эталона ../app/main-screen.html (аватар, имя, вторая строка), только вместо
   позывного роль, а справа ничего: баланса у сотрудника нет. Аватар ведёт в профиль
   сотрудника — туда уезжает «Пароль для входа с компьютера» (Руслан 26-09-2026: «чтобы
   не светилась постоянно»).
   Карточки — из ../app/profile-screen.html (радиус 20, #14171D, рамка 9 %).

   Откуда данные: имя и роль — xb.employees (full_name, role); офисы — employee_offices
   у менеджера, все работающие у owner/admin (server/services/offices/employeeOffices.ts).
   «Ждут выдачи: N» — в ответе сервера сегодня нет, добавляется при вёрстке (Руслан 26-09-2026):
   заказы pending + награды awaiting этого офиса. */

html, body { background: #0B0D11; margin: 0; }
body { display: flex; justify-content: center; }

.screen {
  position: relative; width: 100%; max-width: 520px; min-height: 100dvh;
  box-sizing: border-box; background: #0B0D11; color: #F4F6F8;
  font-family: Manrope, 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column;
  padding-bottom: calc(40px + env(safe-area-inset-bottom));
}

/* ------------------------------------------------------- шапка
   Раскладка и подложка — 1 в 1 с шапкой главного экрана водителя (68 = 14 + 40 + 14). */
.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  height: 68px; box-sizing: border-box; padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  background: rgba(11, 13, 17, 0.82);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.avatar {
  width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0; border: 0; padding: 0; cursor: pointer;
  background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center;
}
.who { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.who b, .who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who b { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
.who span { font-size: 13px; font-weight: 200; letter-spacing: 0.2px; color: #C2C9D3; }

.body { display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 20px; }

/* Заголовок блока — Unbounded 17/600, как «Мои заказы» на главной. */
.title {
  margin: 18px 2px 4px;
  font-family: Unbounded, Manrope, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.3px;
}

/* ------------------------------------------------------- карточка офиса
   Вся карточка — одна кнопка: менеджер у стойки жмёт не глядя. */
.office {
  display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left;
  width: 100%; box-sizing: border-box; padding: 16px 14px 16px 16px;
  border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.09);
  background: #14171D; color: inherit; font-family: inherit;
}
.office:active { background: #1A1E25; }
.office .info { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
/* Название карточки — 16/700 (шкала). */
.office .name { font-size: 16px; font-weight: 700; line-height: 1.3; }
/* Уточнение серым — 13/300. */
.office .addr { font-size: 13px; font-weight: 300; color: #8A93A2; line-height: 1.4; }
/* Состояние цветным словом — 13/600. Ждут — зелёным, как ждущий заказ. Никого нет — строки нет
   вовсе (Руслан 26-09-2026: «Никто не ждёт» убрано). */
.office .wait { margin-top: 5px; font-size: 13px; font-weight: 600; color: #5FD08A; }
.office .chev { flex-shrink: 0; }
</style></head>
<body>
<div class="screen">

  <div class="bar">
    <button class="avatar" aria-label="Профиль">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><circle cx="12" cy="8.5" r="3.6" stroke="#B4BCC8" stroke-width="1.8"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6" stroke="#B4BCC8" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="who"><b>Дилноза Каримова</b><span>Менеджер</span></div>
  </div>

  <div class="body">
    <div class="title">Выберите офис</div>

    <button class="office">
      <span class="info">
        <span class="name">Кадышева</span>
        <span class="addr">ул. Кадышева, 12</span>
        <span class="wait">Ждут выдачи: 3</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M9.5 5.5L16 12l-6.5 6.5" stroke="#6B7483" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="office">
      <span class="info">
        <span class="name">Чиланзар</span>
        <span class="addr">Чиланзар, 9-й квартал, 4</span>
        <span class="wait">Ждут выдачи: 1</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M9.5 5.5L16 12l-6.5 6.5" stroke="#6B7483" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="office">
      <span class="info">
        <span class="name">Юнусабад</span>
        <span class="addr">Юнусабад, 17-й квартал, 22</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M9.5 5.5L16 12l-6.5 6.5" stroke="#6B7483" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
</body></html>
